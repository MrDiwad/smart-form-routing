<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziękujemy!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #fef6ee 0%, #fef3e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2d2d2d;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #d97757 0%, #cc6846 100%);
            padding: 60px 30px;
            color: white;
        }

        .success-icon {
            font-size: 72px;
            margin-bottom: 20px;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 12px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.5;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content {
            padding: 50px 30px;
        }

        .message-box {
            background: #fef6ee;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            border-left: 4px solid #d97757;
        }

        .message-box h2 {
            font-size: 20px;
            color: #d97757;
            margin-bottom: 12px;
        }

        .message-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #5a5a5a;
        }

        .back-btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #d97757 0%, #cc6846 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(217, 119, 87, 0.3);
        }

        .footer {
            padding: 20px;
            font-size: 13px;
            color: #999;
            border-top: 1px solid #f0f0f0;
        }

        @media (max-width: 640px) {
            .header {
                padding: 40px 20px;
            }

            .success-icon {
                font-size: 56px;
            }

            .header h1 {
                font-size: 26px;
            }

            .content {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="success-icon">✅</div>
            <h1>Dziękujemy!</h1>
            <p>Twoja wiadomość została wysłana</p>
        </div>

        <div class="content">
            <div class="message-box">
                <h2>Co dalej?</h2>
                <p>Otrzymaliśmy Twoją wiadomość i odpowiemy tak szybko, jak to możliwe. Zazwyczaj odpowiadamy w ciągu 24
                    godzin.</p>
            </div>

            <a href="index.html" class="back-btn">← Wróć do strony głównej</a>
        </div>


    </div>
</body>

</html>
